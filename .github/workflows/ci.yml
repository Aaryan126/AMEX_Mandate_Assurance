name: continuous-verification

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: python -m pip install -e 'services/api[dev,ml]'
      - run: npm ci --prefix apps/web
      - run: python -m ruff check services/api/app services/api/tests services/api/migrations ml tests
      - run: python -m pytest services/api/tests tests -q
      - run: npm --prefix apps/web run types:api
      - run: npm --prefix apps/web test -- --run
      - run: npm --prefix apps/web run build
      - run: npx --prefix apps/web playwright install --with-deps chromium
      - run: npm --prefix apps/web run test:e2e

