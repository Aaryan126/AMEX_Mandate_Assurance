[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ace-mandate-assurance-api"
version = "0.1.0"
description = "ACE Mandate Assurance prototype API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "cryptography>=44,<46",
  "catboost>=1.2,<2",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]
ml = [
  "numpy>=2.1,<3",
  "scikit-learn>=1.6,<2",
  "pandas>=2.2,<3",
  "pyarrow>=18,<22",
  "duckdb>=1.1,<2",
  "certifi>=2025.1",
  "openpyxl>=3.1,<4",
]
semantic = [
  "torch>=2.6,<3",
  "transformers>=4.48,<6",
  "sentencepiece>=0.2,<1",
  "huggingface-hub>=0.28,<2",
]
annotation = [
  "openai>=2.0,<3",
]
tabm = [
  "tabm>=0.0.3,<1",
  "torch>=2.6,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
